name: WR Branch Filter Probe - main

on:
  workflow_run:
    workflows:
      - PR Branch Probe Upstream
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print workflow_run context
        shell: bash
        run: |
          set -euo pipefail
          echo "workflow_run.id=${{ github.event.workflow_run.id }}"
          echo "workflow_run.name=${{ github.event.workflow_run.name }}"
          echo "workflow_run.event=${{ github.event.workflow_run.event }}"
          echo "workflow_run.conclusion=${{ github.event.workflow_run.conclusion }}"
          echo "workflow_run.head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "workflow_run.head_sha=${{ github.event.workflow_run.head_sha }}"
          echo "workflow_run.head_repository=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "workflow_run.repository=${{ github.event.workflow_run.repository.full_name }}"
          echo "workflow_run.pull_requests=${{ toJson(github.event.workflow_run.pull_requests) }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.ref_name=${{ github.ref_name }}"

      - name: Persist workflow_run payloads
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '${{ toJson(github.event.workflow_run) }}' > workflow_run.json
          printf '%s\n' '${{ toJson(github.event) }}' > full_event.json

      - name: Upload workflow_run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wr-branch-filter-probe-main-${{ github.run_id }}
          path: |
            workflow_run.json
            full_event.json
